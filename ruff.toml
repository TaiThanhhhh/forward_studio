line-length = 125
target-version = "py310"
extend-exclude = [".venv", "projects", "vendor"]

[lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["B905", "E731", "UP015"]

[lint.per-file-ignores]
"vidlib/page.py" = ["E501"]  # CSS/JS/HTML template nhúng
"vidlib/qareport.py" = ["E501"]  # bảng markdown/HTML của báo cáo
"vidlib/enginebench.py" = ["E501"]  # bảng markdown của PERF.md + trang HTML benchmark
"scripts/style_compare.py" = ["E501"]  # bảng markdown + filter ffmpeg
"vidlib/styles.py" = ["E501"]  # card_md: dòng markdown của thẻ style
"ui/server/services/workspace.py" = ["E501"]  # dict JSON dài của API
"scripts/ui_check.py" = ["E501"]  # JS nhúng cho Playwright
"scripts/ui_shots.py" = ["E501"]
"scripts/ui_e2e.py" = ["E501"]  # storyboard mẫu của bài kiểm
"scripts/verify_partc.py" = ["E501"]
