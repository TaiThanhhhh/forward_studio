# CI (AUD-1301): lint + unit test trên Windows và Ubuntu. Ca visual regression cần GPU/Edge → chạy tay
# (python scripts/visual_regression.py) hoặc trên runner tự host có STUDIO_VISUAL=1.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: lint
        run: python -m ruff check .
      - name: doctor (không cần trình duyệt)
        run: python studio.py doctor --no-browser
        continue-on-error: true
      - name: unit tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -t .
